<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Region</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent !important; cursor: crosshair;
      user-select: none; -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    /* Dim veil over the whole screen so the selection stands out. */
    #veil {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.35);
    }
    /* The live selection rectangle. */
    #rect {
      position: fixed; display: none;
      border: 1.5px solid #4c9aff;
      background: rgba(76, 154, 255, 0.12);
      box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.35);
    }
    #hint {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 30, 0.85); color: #fff;
      font-size: 12px; padding: 6px 12px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15); white-space: nowrap;
    }
    #size {
      position: fixed; display: none;
      background: rgba(20, 20, 30, 0.9); color: #fff;
      font-size: 11px; padding: 2px 6px; border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="veil"></div>
  <div id="hint">Drag to select a region · Esc to cancel</div>
  <div id="rect"></div>
  <div id="size"></div>

  <script>
    const rectEl = document.getElementById('rect');
    const sizeEl = document.getElementById('size');
    const hintEl = document.getElementById('hint');

    let startX = 0, startY = 0, dragging = false;

    function updateRect(x1, y1, x2, y2) {
      const x = Math.min(x1, x2);
      const y = Math.min(y1, y2);
      const w = Math.abs(x2 - x1);
      const h = Math.abs(y2 - y1);
      rectEl.style.display = 'block';
      rectEl.style.left = x + 'px';
      rectEl.style.top = y + 'px';
      rectEl.style.width = w + 'px';
      rectEl.style.height = h + 'px';
      sizeEl.style.display = 'block';
      sizeEl.textContent = `${Math.round(w)} × ${Math.round(h)}`;
      sizeEl.style.left = (x) + 'px';
      sizeEl.style.top = Math.max(0, y - 20) + 'px';
      return { x, y, width: w, height: h };
    }

    window.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      hintEl.style.display = 'none';
      updateRect(startX, startY, startX, startY);
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      updateRect(startX, startY, e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', (e) => {
      if (!dragging) return;
      dragging = false;
      const r = updateRect(startX, startY, e.clientX, e.clientY);
      if (r.width < 2 || r.height < 2) {
        window.electronAPI && window.electronAPI.cancelRegion();
        return;
      }
      // rect is in logical (CSS) pixels relative to this display's top-left.
      window.electronAPI && window.electronAPI.sendRegion(r);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.electronAPI && window.electronAPI.cancelRegion();
      }
    });
  </script>
</body>
</html>
